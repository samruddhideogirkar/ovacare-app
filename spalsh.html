<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Splash Screen - OvaCare</title>
  <style>
    body{
      background-image:url('assets/splash.png');

    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }

    .splash-container {
      text-align: center;
      animation: fadeIn 1.5s ease-in-out;
    }

    .logo {
      width: 120px;
      height: 120px;
      margin-bottom: 20px;
      animation: popIn 1s ease;
    }

    h1 {
      color: #5C2D91;
      font-size: 28px;
      margin: 0;
    }

    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <img src="assets/logo.png" alt="OvaCare Logo" class="logo">
    <h1>OvaCare</h1>
  </div>

  <script>
    setTimeout(() => {
      window.location.href = "index.html";
    }, 3000); // 3 seconds
  </script>
</body>
</html>
